# Markdownlint configuration file
# See https://raw.githubusercontent.com/DavidAnson/markdownlint/refs/tags/v0.40.0/schema/.markdownlint.yaml

# Default state for all rules
default: true

# Path to configuration file to extend
extends: null

# MD007/ul-indent : Unordered list indentation : https://github.com/DavidAnson/markdownlint/blob/v0.40.0/doc/md007.md
MD007:
  # Spaces for indent (mkdocs wants 4)
  indent: 4
  # Whether to indent the first level of the list
  start_indented: false
  # Spaces for first level indent (when start_indented is set)
  start_indent: 2
